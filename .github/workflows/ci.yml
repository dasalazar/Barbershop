name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run linter
        run: npm run lint

      - name: Run unit & integration tests
        run: npm test -- --run

  e2e:
    runs-on: ubuntu-latest
    needs: validate

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: barbershop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Write .env.test
        run: |
          cat <<EOF > .env.test
          DATABASE_URL="postgresql://postgres:postgres@localhost:5432/barbershop_test?schema=public"
          NEXTAUTH_SECRET="e2e-test-secret"
          NEXTAUTH_URL="http://localhost:3000"
          GOOGLE_CLIENT_ID="e2e-test-client-id"
          GOOGLE_CLIENT_SECRET="e2e-test-client-secret"
          EOF

      - name: Apply database schema
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/barbershop_test?schema=public"

      - name: Run e2e tests
        run: npm run test:e2e
